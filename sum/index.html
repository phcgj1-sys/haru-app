<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var HP=JSON.parse(localStorage.getItem('haru_prefs_v1')||'{}');if(HP.fs>1&&HP.fs<2)document.documentElement.style.zoom=HP.fs;}catch(e){}</script>
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F10" media="(prefers-color-scheme: dark)">
<title>핵심 요약 · 하루 학습</title>
<meta name="description" content="앱마다 모든 수업을 빠짐없이 짧게 줄인 핵심 요약본. 10~15분이면 앱 하나를 다 훑어봐요.">
<meta property="og:title" content="핵심 요약 · 하루 학습">
<meta property="og:description" content="앱마다 모든 수업을 짧게 줄인 요약본. 꼭 기억할 것·단계별 요점·꼭 쓰는 명령·자주 하는 실수.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preload" href="../fonts/pretendard/pretendard.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="../fonts/pretendard/pretendard.css"></noscript>
<style>
:root{--bg:#F7F7F5;--surface:#FFFFFF;--fg:#111111;--muted:#666666;--line:#E2E2DE;--soft:#EFEFEB;--ok:#157A43;--ok-soft:#E1F5E9;--warn:#8A4B00;--warn-soft:#FFF1DC;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0F0F10;--surface:#1A1A1C;--fg:#F2F2F2;--muted:#A6A6AA;--line:#2C2C2F;--soft:#232326;--ok:#3FD98B;--ok-soft:#10301F;--warn:#FFC266;--warn-soft:#33240F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.app{max-width:680px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.025em}
h2{font-size:17px;margin:0 0 8px;font-weight:800;letter-spacing:-.015em}
.sub{color:var(--muted);font-size:14px;margin:4px 0 16px}
a{color:inherit}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14.5px;font-weight:600;text-decoration:none;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;background:var(--soft);border-radius:14px;padding:5px;margin:0 0 16px}
.seg a{display:flex;flex-direction:column;justify-content:center;min-height:56px;border-radius:10px;padding:7px 9px;text-decoration:none;color:var(--muted)}
.seg a b{font-size:14.5px;color:var(--fg)}
.seg a span{font-size:11.5px;line-height:1.35}
.seg a[aria-current="page"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.box p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.grp{margin:22px 0 10px;color:var(--muted);font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:480px){.grid{grid-template-columns:1fr 1fr}}
a.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit;min-height:76px}
.ic{width:44px;height:44px;border-radius:13px;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;background:#111111}
@media (prefers-color-scheme: dark){.ic.plain{background:#3A3A40}}
.t{font-weight:700;font-size:16px}
.s{color:var(--muted);font-size:13px;margin-top:1px}
.s .read{color:var(--ok);font-weight:700}
.one{font-size:16.5px;font-weight:600;margin:4px 0 0}
.must{list-style:none;margin:0;padding:0;counter-reset:m}
.must li{counter-increment:m;display:grid;grid-template-columns:28px 1fr;gap:4px 8px;padding:9px 0;border-top:1px solid var(--line)}
.must li:first-child{border-top:0}
.must li::before{content:counter(m);grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.must b{font-size:15px}
.must span{font-size:14px;color:var(--muted)}
.stage{margin:18px 0 0}
.stage ul{margin:0;padding-left:20px}
.stage li{margin:7px 0;font-size:15px}
.one,.must span,.stage li,.mis td{white-space:pre-wrap}
.lk{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px;vertical-align:baseline}
.lk a{display:inline-flex;align-items:center;min-height:30px;font-size:12px;font-weight:700;text-decoration:none;background:var(--soft);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tool{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.tool .tn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.tool .tn button{margin-left:auto}
.tool pre{margin:6px 0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:13.5px;line-height:1.5}
.tool .tm{font-size:13px;color:var(--muted)}
.mis{width:100%;border-collapse:collapse;font-size:14.5px}
.mis td{border-top:1px solid var(--line);padding:9px 4px;vertical-align:top;width:50%}
.mis tr:first-child td{border-top:0}
.mis td:first-child{color:var(--warn)}
.mis td:last-child{color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:12px;border:0;background:var(--fg);color:var(--bg);font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--fg)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
a:focus-visible,button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media print{body{background:#fff;color:#000;font-size:12pt}.seg,.back,.row,.lk,.tool .tn button,.foot{display:none!important}.box{border:0;padding:0;margin:0 0 10pt}.app{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="app" id="root"></div>
<script>
var APPS = [{"name":"외국어","apps":[{"slug":"en","title":"하루영어","ic":"EN","color":"","min":10,"n":0,"plan":true},{"slug":"ja","title":"하루일본어","ic":"日","color":"#B3261E","min":9,"n":0,"plan":true},{"slug":"th","title":"하루태국어","ic":"ไทย","color":"#1E6FB3","min":10,"n":0,"plan":true},{"slug":"listen","title":"영어 듣기 집중","ic":"듣기","color":"#B3261E","min":9,"n":29,"plan":true}]},{"name":"생활 기초","apps":[{"slug":"basics","title":"스마트폰·컴퓨터 기초","ic":"기초","color":"#5F6368","min":10,"n":28,"plan":true},{"slug":"money","title":"돈 관리 기초","ic":"돈","color":"#B06A00","min":10,"n":29,"plan":true},{"slug":"media","title":"사진·영상 편집 기초","ic":"편집","color":"#8E24AA","min":11,"n":34,"plan":true},{"slug":"writing","title":"AI로 글쓰기","ic":"글","color":"#1A73E8","min":9,"n":30,"plan":true}]},{"name":"일과 도구","apps":[{"slug":"excel","title":"엑셀 배우기","ic":"표","color":"#2B5F75","min":11,"n":33,"plan":true},{"slug":"sheets","title":"구글 시트·폼 배우기","ic":"시트","color":"#5B5F97","min":9,"n":29,"plan":true},{"slug":"claude","title":"클로드 배우기","ic":"CL","color":"#4A4A4A","min":11,"n":50,"plan":true},{"slug":"homepage","title":"클로드로 홈페이지 잘 만들기","ic":"홈","color":"#0B7285","min":12,"n":34,"plan":true},{"slug":"youtube","title":"클로드로 유튜브 채널 만들기","ic":"영상","color":"#7C3A5E","min":12,"n":36,"plan":true},{"slug":"github","title":"깃허브 처음부터 배우기","ic":"깃","color":"#3A4A63","min":10,"n":30,"plan":true},{"slug":"linux","title":"리눅스 서버 장애 판별","ic":"서버","color":"#2F5D3A","min":14,"n":31,"plan":true},{"slug":"winpc","title":"윈도우 PC 장애 판별","ic":"PC","color":"#0F5A9E","min":11,"n":30,"plan":true},{"slug":"network","title":"네트워크 기초","ic":"망","color":"#00695C","min":10,"n":30,"plan":true},{"slug":"script","title":"쉘 스크립트와 서버 자동화","ic":"자동","color":"#455A64","min":11,"n":30,"plan":true}]},{"name":"AI 기초","apps":[{"slug":"found","title":"AI 기초: 개발 환경과 수학","ic":"기초","color":"#4338CA","min":12,"n":35,"plan":true},{"slug":"ml","title":"머신러닝·딥러닝 기초","ic":"ML","color":"#9D174D","min":13,"n":34,"plan":true},{"slug":"cv","title":"컴퓨터 비전","ic":"비전","color":"#0E7490","min":10,"n":28,"plan":true},{"slug":"nlp","title":"자연어 처리","ic":"NLP","color":"#9A3412","min":11,"n":29,"plan":true},{"slug":"gen","title":"생성형 AI와 음성","ic":"생성","color":"#86198F","min":11,"n":32,"plan":true},{"slug":"rl","title":"강화학습","ic":"RL","color":"#3F6212","min":7,"n":12,"plan":true},{"slug":"llm","title":"트랜스포머와 LLM 직접 만들기","ic":"LLM","color":"#1E3A8A","min":15,"n":40,"plan":true}]},{"name":"AI 엔지니어링","apps":[{"slug":"ai","title":"AI 엔지니어링: LLM 앱 만들기","ic":"AI","color":"#3553FF","min":7,"n":17,"plan":true},{"slug":"mm","title":"멀티모달 AI","ic":"멀티모달","color":"#B4235A","min":10,"n":25,"plan":true},{"slug":"tools","title":"AI 도구와 프로토콜: MCP·스킬","ic":"MCP","color":"#0B6E6E","min":13,"n":31,"plan":true},{"slug":"re","title":"리버스 엔지니어링: 내 프로그램 읽기","ic":"RE","color":"#374151","min":8,"n":14,"plan":true},{"slug":"agent","title":"AI 에이전트 엔지니어링","ic":"에이전트","color":"#5B3CC4","min":18,"n":54,"plan":true},{"slug":"auto","title":"AI 자율 시스템과 안전","ic":"자율","color":"#8E2C48","min":9,"n":22,"plan":true},{"slug":"multi","title":"AI 다중 에이전트와 스웜","ic":"멀티","color":"#1F5FA8","min":9,"n":25,"plan":true},{"slug":"infra","title":"AI 인프라와 운영","ic":"운영","color":"#A35200","min":10,"n":29,"plan":true},{"slug":"safety","title":"AI 윤리·안전·정렬","ic":"안전","color":"#2E6B30","min":11,"n":30,"plan":true},{"slug":"cap","title":"캡스톤 프로젝트","ic":"캡스톤","color":"#92400E","min":21,"n":85,"plan":true}]}];
var SEG = "<nav class=\"seg\" aria-label=\"학습 방식 고르기\"><a href=\"../index.html\"><b>앱별 학습</b><span>앱마다 모든 수업</span></a><a href=\"../plan/index.html\"><b>20시간 계획</b><span>핵심 20% · 10세션</span></a><a href=\"../sum/index.html\" aria-current=\"page\"><b>핵심 요약</b><span>전체를 10분에</span></a></nav>";
var KEY = 'haru_sum_v1';
var store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function appInfo(slug) { for (var g = 0; g < APPS.length; g++) for (var i = 0; i < APPS[g].apps.length; i++) if (APPS[g].apps[i].slug === slug) return APPS[g].apps[i]; return null; }
function icon(a) { return '<span class="ic' + (a.color ? '' : ' plain') + '"' + (a.color ? ' style="background:' + a.color + (a.ic.length > 2 ? ';font-size:12px' : '') + '"' : '') + '>' + esc(a.ic) + '</span>'; }
var root = document.getElementById('root');

function renderList() {
  document.title = '핵심 요약 · 하루 학습';
  var h = '<a class="back" href="../index.html">‹ 하루 학습</a>' + SEG;
  h += '<h1>핵심 요약</h1><p class="sub">앱마다 모든 수업을 빠짐없이 짧게 줄였어요. 앱 하나를 10~15분에 훑어봐요.</p>';
  h += '<div class="box small"><b>이렇게 써요</b><p class="muted">처음엔 요약으로 앱 전체 지도를 잡고, 더 알고 싶은 요점 옆의 \'수업\' 표시를 눌러 그 수업으로 가요. 복습할 때는 \'꼭 기억할 것\'과 \'자주 하는 실수\'만 다시 읽어도 돼요. 인쇄하면 한 장짜리 정리 노트가 돼요.</p></div>';
  for (var g = 0; g < APPS.length; g++) {
    h += '<h2 class="grp">' + esc(APPS[g].name) + '</h2><div class="grid">';
    for (var i = 0; i < APPS[g].apps.length; i++) {
      var a = APPS[g].apps[i];
      h += '<a class="card" href="#app=' + a.slug + '">' + icon(a) + '<span style="flex:1;min-width:0"><div class="t">' + esc(a.title) + '</div><div class="s">약 ' + a.min + '분' + (a.n ? ' · 수업 ' + a.n + '개 요약' : '') + (store[a.slug] ? ' · <span class="read">✓ 읽음</span>' : '') + '</div></span></a>';
    }
    h += '</div>';
  }
  h += '<p class="foot">요약은 각 앱의 수업 내용만으로 만들었어요. 읽음 표시는 이 기기에만 저장돼요.</p>';
  root.innerHTML = h;
  window.scrollTo(0, 0);
}

function loadSum(slug, cb) {
  window.SUM_DATA = window.SUM_DATA || {};
  if (window.SUM_DATA[slug]) return cb(window.SUM_DATA[slug]);
  var s = document.createElement('script');
  s.src = 'data/' + slug + '.js';
  s.onload = function () { cb(window.SUM_DATA[slug] || null); };
  s.onerror = function () { cb(null); };
  document.head.appendChild(s);
}

function links(slug, ids) {
  var parts = String(ids || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
  if (!parts.length) return '';
  return '<span class="lk">' + parts.map(function (id) { return '<a href="../' + slug + '/index.html#lesson=' + id + '" aria-label="수업 ' + esc(id.replace(/^l0?/, '')) + ' 열기">수업 ' + esc(id.replace(/^l0?/, '')) + '</a>'; }).join('') + '</span>';
}

function renderSum(slug) {
  var info = appInfo(slug);
  if (!info) { location.hash = ''; return; }
  root.innerHTML = '<a class="back" href="#">‹ 요약 목록</a><p class="muted">요약을 불러오는 중이에요…</p>';
  loadSum(slug, function (S) {
    if (!S) { root.innerHTML = '<a class="back" href="#">‹ 요약 목록</a><div class="box"><b>요약을 불러오지 못했어요.</b><p class="small muted">인터넷 연결을 확인하고 다시 열어 주세요.</p></div>'; return; }
    document.title = S.title + ' 핵심 요약 · 하루 학습';
    var h = '<a class="back" href="#">‹ 요약 목록</a>';
    h += '<div style="display:flex;gap:12px;align-items:center;margin:4px 0 8px">' + icon(info) + '<div><h1 style="font-size:21px">' + esc(S.title) + '</h1><div class="small muted">핵심 요약 · 약 ' + info.min + '분' + (info.n ? ' · 수업 ' + info.n + '개' : '') + '</div></div></div>';
    h += '<div class="box"><p class="one">' + esc(S.one) + '</p><div class="row"><a class="btn ghost" href="../' + slug + '/index.html">앱 열기</a>' + (info.plan ? '<a class="btn ghost" href="../plan/index.html#app=' + slug + '">20시간 계획</a>' : '') + '<button class="btn ghost" type="button" id="print">인쇄</button></div></div>';
    h += '<div class="box"><h2>꼭 기억할 것</h2><ol class="must">' + S.must.map(function (m) { return '<li><b>' + esc(m[0]) + '</b><span>' + esc(m[1]) + '</span></li>'; }).join('') + '</ol></div>';
    h += '<div class="box"><h2>단계별 요점</h2>';
    S.stages.forEach(function (st) {
      h += '<section class="stage"><h3 style="font-size:15px;margin:0 0 4px">' + esc(st.t) + '</h3><ul>' + st.pts.map(function (p) { return '<li>' + esc(p[0]) + links(slug, p[1]) + '</li>'; }).join('') + '</ul></section>';
    });
    h += '</div>';
    h += '<div class="box"><h2>꼭 쓰는 것</h2>' + S.tools.map(function (t, i) { return '<div class="tool"><div class="tn">' + esc(t[0]) + '<button class="btn ghost sm" type="button" data-copy="' + i + '">복사</button></div><pre>' + esc(t[1]) + '</pre><div class="tm">' + esc(t[2]) + '</div></div>'; }).join('') + '</div>';
    h += '<div class="box"><h2>자주 하는 실수</h2><table class="mis"><tbody>' + S.mistakes.map(function (m) { return '<tr><td>✕ ' + esc(m[0]) + '</td><td>→ ' + esc(m[1]) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    h += '<div class="row"><button class="btn" type="button" id="read">' + (store[slug] ? '읽음 표시 지우기' : '다 읽었어요') + '</button>' + (store[slug] ? '<span class="small muted">' + esc(store[slug]) + ' 읽음</span>' : '') + '</div>';
    h += '<p class="foot">요점 옆 \'수업\' 표시를 누르면 그 수업이 바로 열려요. 요약은 각 수업 내용만으로 만들었어요.</p>';
    root.innerHTML = h;
    window.scrollTo(0, 0);
    root.onclick = function (ev) {
      var b = ev.target.closest('button');
      if (!b) return;
      if (b.id === 'print') { window.print(); return; }
      if (b.id === 'read') {
        if (store[slug]) delete store[slug];
        else { var d = new Date(); store[slug] = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
        save(); renderSum(slug); return;
      }
      if (b.dataset.copy) {
        var text = S.tools[+b.dataset.copy][1];
        var done = function () { b.textContent = '복사했어요'; setTimeout(function () { b.textContent = '복사'; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallback(text); done(); });
        else { fallback(text); done(); }
      }
    };
  });
}
function fallback(text) { var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t); }

function route() {
  var m = /^#app=([a-z0-9]+)$/.exec(location.hash);
  if (m) renderSum(m[1]); else renderList();
}
window.addEventListener('hashchange', route);
route();
if ('serviceWorker' in navigator && location.protocol !== 'file:') { navigator.serviceWorker.register('../sw.js').catch(function () {}); }
</script>
</body>
</html>
