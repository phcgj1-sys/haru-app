function lev(a,b){ a=[...a]; b=[...b]; const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; }

const TOPICS=[['free','자유 대화','We are just chatting casually about daily life.'],['cafe','카페·식당 주문','You are staff at a cafe/restaurant; the learner is a customer ordering.'],['intro','자기소개','You are a new acquaintance meeting the learner for the first time.'],['travel','여행·길 묻기','You are a local; the learner is a tourist asking for directions and tips.'],['shop','쇼핑','You are a shop clerk; the learner is buying something.'],['hotel','호텔','You are hotel front desk staff; the learner is checking in and asking questions.'],['weekend','주말 이야기','You are a friend asking about the learner\'s weekend and plans.']];
const LVDESC={easy:'EASY: very simple words, polite basic forms, at most 8 words per sentence, speak slowly and clearly.',normal:'NORMAL: everyday natural language, short sentences.',real:'REAL: natural native-speaker speech with casual expressions, like a real conversation.'};
function chatRules(){ const t=TOPICS.find(x=>x[0]===ui.chat.topic)||TOPICS[0];

- reply_read: how to read reply (${LANG.readingHint}).

- fix_read: reading of fix (${LANG.readingHint}) or "". fix_ko: one short Korean sentence explaining the fix in simple words, or "".
- hint: one short example sentence the learner could say next, in ${LANG.chatLang}. hint_read: its reading. hint_ko: its Korean meaning.
Keep every field short. Korean fields must be in Korean.`; }
function viewChat(){

async function chatSend(userText){
  const c=ui.chat; if(c.busy||!AI.fn) return;
  c.busy=true; c.err='';
  if(userText!=null){ c.msgs.push({who:'me', text:userText}); c.turns.push({role:'user', content:userText}); state.chatTurns++; touchStreak(); commit(); }
  const turns=c.turns.slice(-20);
  const input=[{role:'user', content: chatRules() + (userText==null? '\n\nThe learner has not said anything yet. Start the conversation: greet the learner briefly and ask one easy first question. fix, fix_read and fix_ko must be "".' : '')}].concat(turns);
  if(userText==null && !turns.length) input.push({role:'user', content:'(start)'});
  render(); c.ctl=new AbortController();
  try{
    const r=await AI.fn.json(input, {modelTier:'quick', cache:false, signal:c.ctl.signal});
    const o=(r&&typeof r==='object')? r : {};
    const reply=String(o.reply||'').trim(); if(!reply) throw {code:'empty_completion'};
    const ai={who:'ai', reply, reply_read:String(o.reply_read||''), reply_ko:String(o.reply_ko||''), hint:String(o.hint||''), hint_read:String(o.hint_read||''), hint_ko:String(o.hint_ko||''), show:false};
    const last=c.msgs.filter(m=>m.who==='me').pop(); if(last && userText!=null){ last.fix=String(o.fix||'').trim(); last.fix_read=String(o.fix_read||''); last.fix_ko=String(o.fix_ko||''); if(last.fix && normS(last.fix)===normS(last.text)) last.fix=''; }
    c.msgs.push(ai); c.turns.push({role:'assistant', content:JSON.stringify({reply, reply_ko:ai.reply_ko})});
    if(state.settings.autoPlay) TTS.speak(reply);
  }catch(e){
    const code=e&&e.code; const map={not_granted:'이 앱이 Claude를 쓰도록 허용하지 않았어요. 허용하면 대화를 시작할 수 있어요.', sampling_disabled:'이 계정에서는 AI 대화를 쓸 수 없어요.', rate_limited:'요청이 너무 많아요. 잠시 뒤에 다시 보내 주세요.', session_expired:'로그인이 풀렸어요. 다시 로그인해 주세요.', cancelled:'', invalid_json:'답을 읽지 못했어요. 한 번 더 보내 주세요.', refused:'이 내용에는 답할 수 없대요. 다른 말을 해 보세요.', empty_completion:'답이 비어 있어요. 한 번 더 보내 주세요.'};
    c.err = code in map? map[code] : '연결에 문제가 생겼어요. 잠시 뒤 다시 보내 주세요.';
    if(code==='not_granted'||code==='sampling_disabled'){ AI.ready=false; }
  }
  c.busy=false; c.ctl=null; render(); const b2=$('#chatIn'); if(b2) b2.focus(); window.scrollTo(0, document.body.scrollHeight);
}

let S=null;

function cur(){ return S.q[S.i]; }
function renderSession(){

  const it=cur(); const pct=Math.round(S.i/S.q.length*100);
  const head=`<div class="head"><button class="btn sm ghost" data-act="exit">나가기</button><div class="bar"><i style="width:${pct}%"></i></div><span class="lbl num">${S.i+1} / ${S.q.length}</span></div>`;
  let body=''; if(it.t==='learn') body=viewLearn(it); else if(it.t==='quiz') body=viewQuiz(it); else if(it.t==='slearn') body=viewSLearn(it); else if(it.t==='squiz') body=viewSQuiz(it); else if(it.t==='dline') body=viewDLine(it);

    if(it.t==='learn') TTS.speak(it.w.en); else if(it.t==='quiz' && (it.mode==='listen'||it.mode==='ko')) TTS.speak(it.w.en); else if(it.t==='slearn' && it.stage===0) TTS.speak(it.s.en); else if(it.t==='squiz' && it.mode==='dict') TTS.speak(it.s.en); else if(it.t==='dline' && !it.mine) TTS.speak(lineEn(it.line), {who:it.who}); }
}

function modeFor(p){ const r=Math.random(); if(p.b<=2) return r<0.6?'ko':'listen'; if(p.b<=4) return r<0.4?'en':r<0.7?'listen':'ko'; return r<0.6?'en':'listen'; }
function startSession(kind, opt){
  if(kind.startsWith('sent')) return startSentSession(kind, opt);
  if(kind==='drole') return startDialogSession(opt);
  opt=opt||{}; const q=[]; let title='학습';

    if(kind!=='review'){ const n= kind==='extra'? state.settings.newPerDay : Math.max(0, state.settings.newPerDay-rec.n); const nw=unlearned().slice(0,n); nw.forEach(w=>q.push({t:'learn', w})); shuffle(nw).forEach(w=>q.push({t:'quiz', w, mode:'ko', fresh:true})); shuffle(nw).forEach(w=>q.push({t:'quiz', w, mode:Math.random()<0.5?'en':'listen', fresh:true})); }
    title = kind==='review'?'단어 복습':'오늘의 단어'; }
  else if(kind==='listen'){ pick(learned(),10).forEach(w=>q.push({t:'quiz', w, mode:'listen', free:true})); title='듣기 퀴즈'; }
  else if(kind==='theme-new'){ const t=THEMES.find(x=>x.id===opt.theme); const nw=t.words.map((w,i)=>WMAP[t.id+'_'+i]).filter(w=>prog(w.id).b===0).slice(0,15); nw.forEach(w=>q.push({t:'learn', w})); shuffle(nw).forEach(w=>q.push({t:'quiz', w, mode:'ko', fresh:true})); shuffle(nw).forEach(w=>q.push({t:'quiz', w, mode:Math.random()<0.5?'en':'listen', fresh:true})); title=t.name; }
  else if(kind==='theme-quiz'){ const t=THEMES.find(x=>x.id===opt.theme); shuffle(t.words.map((w,i)=>WMAP[t.id+'_'+i])).forEach(w=>q.push({t:'quiz', w, mode:Math.random()<0.5?'ko':'en', free:true})); title=t.name+' 퀴즈'; }

}

  if(d.group && !d.act){ ui.group=d.group; ui.openWord=null; render(); window.scrollTo(0,0); return; }
  if(d.dialog && !d.act){ ui.dialog=d.dialog; ui.showAll=false; render(); window.scrollTo(0,0); return; }
  if(d.open){ ui.openWord = ui.openWord===d.open? null : d.open; render(); return; }
  if(d.pattern && !d.act){ ui.pattern=d.pattern; ui.build=null; ui.slot=null; render(); window.scrollTo(0,0); return; }
  if(d.slot!=null){ ui.slot=+d.slot; render(); const p=PATTERNS.find(x=>x.id===ui.pattern); if(p) TTS.speak(tplFill(p.tpl, p.slots[ui.slot][0])); return; }
  if(d.pick!=null){ const bld=ui.build; if(bld&&!bld.result){ bld.picked.push({i:+d.pick, w:bld.tokens[+d.pick]}); render(); } return; }
  if(d.unpick!=null){ const bld=ui.build; if(bld&&!bld.result){ bld.picked.splice(+d.unpick,1); render(); } return; }
  if(d.spick!=null){ if(!S||S.answered) return; const it=cur(); it.bld.picked.push({i:+d.spick, w:it.bld.tokens[+d.spick]}); renderSession(); return; }
  if(d.sunpick!=null){ if(!S||S.answered) return; const it=cur(); it.bld.picked.splice(+d.sunpick,1); renderSession(); return; }
  if(d.sopt!=null){ if(!S||S.answered) return; const it=cur(); it.pickedIdx=+d.sopt; answerS(it.cz.opts[+d.sopt]===it.cz.ans? 2:0); return; }
  if(d.reading && !d.act){ ui.reading=d.reading; ui.openSent=null; ui.showAll=false; render(); window.scrollTo(0,0); return; }
  if(d.sent!=null){ const r=READINGS.find(x=>x.id===ui.reading); ui.openSent = ui.openSent===+d.sent? null : +d.sent; render(); if(ui.openSent!=null && r) TTS.speak(disp(r.sents[+d.sent][0])); return; }
  if(d.more){ ui.more=d.more; ui.confirmReset=false; render(); return; }
  if(d.topic){ ui.chat.topic=d.topic; render(); return; }
  if(d.chatlv){ ui.chat.level=d.chatlv; render(); return; }
  if(d.set){ let v=d.val; if(d.set==='newPerDay'||d.set==='newSentsPerDay') v=+v; else if(d.set==='rate') v=+v; else if(d.set==='autoPlay'||d.set==='showReading') v=v==='1'; state.settings[d.set]=v; commit(); render(); return; }
  if(d.opt!=null){ if(!S||S.answered) return; const it=cur(); it.pickedIdx=+d.opt; answer(it.opts[+d.opt].id===it.w.id); return; }
  const act=d.act; if(!act) return;
  switch(act){
    case 'start': startSession(d.kind, {theme:d.theme, group:d.group, dialog:d.dialog, role:d.role}); break;
    case 'exit': endSession(); break;
    case 'next': if(!S) return; S.i++; S.answered=false; renderSession(); break;
    case 'known': { if(!S) return; const it=cur(); const p=Object.assign({b:0,d:0,s:0,c:0,w:0}, prog(it.w.id)); if(p.b===0){ p.b=4; p.d=Date.now()+INTERVALS[4]*DAY; p.l=Date.now(); setProg(it.w.id,p); S.learnedSet[it.w.id]=1; S.newN++; bumpDaily(r=>r.n++); } S.q=S.q.filter((x,i)=> i<=S.i || !x.w || x.w.id!==it.w.id); touchStreak(); commit(); S.i++; S.answered=false; renderSession(); break; }
    case 's-known': { if(!S) return; const it=cur(); const p=Object.assign({b:0,d:0,s:0,c:0,w:0}, sprog(it.s.id)); if(p.b===0){ p.b=4; p.d=Date.now()+INTERVALS[4]*DAY; p.l=Date.now(); setSprog(it.s.id,p); S.learnedSet[it.s.id]=1; S.newN++; bumpDaily(r=>r.sn++); } S.q=S.q.filter((x,i)=> i<=S.i || !x.s || x.s.id!==it.s.id); touchStreak(); commit(); S.i++; S.answered=false; renderSession(); break; }
    case 's-reveal': { if(!S) return; const it=cur(); it.reveal=true; renderSession(); TTS.speak(it.s.en); break; }
    case 's-show': { if(!S||S.answered) return; const it=cur(); const inp=$('#sentIn'); it.typed=(inp?inp.value:'').trim(); it.revealed=true; renderSession(); TTS.speak(it.s.en); break; }
    case 's-self': { if(!S||S.answered) return; answerS(d.ok==='1'? 2:0); break; }
    case 's-check-text': { if(!S||S.answered) return; const it=cur(); const inp=$('#sentIn'); const typed=(inp?inp.value:'').trim(); if(!typed){ toast('문장을 쓰거나 정답 보기를 누르세요'); return; } it.typed=typed; answerS(sentScore(typed, it.s.en, it.s.rd)); break; }
    case 's-check-order': { if(!S||S.answered) return; const it=cur(); answerS(J(it.bld.picked.map(x=>x.w))===it.s.en? 2:0); break; }
    case 's-reset': { if(!S||S.answered) return; cur().bld.picked=[]; renderSession(); break; }
    case 'd-hint': { if(!S) return; cur().hint=true; renderSession(); break; }
    case 'd-reveal': { if(!S) return; const it=cur(); it.reveal=true; renderSession(); TTS.speak(lineEn(it.line), {who:it.who}); break; }
    case 'd-self': { if(!S||S.answered) return; if(d.ok==='1') S.ok++; else S.ng++; S.i++; S.answered=false; renderSession(); break; }
    case 'dlg-play': { const dg=DIALOGS.find(x=>x.id===d.dialog); if(dg) TTS.seq(dg.lines.map(l=>[l[0]==='A'?0:1, lineEn(l)]), 500); break; }
    case 'chat-start': { const c=ui.chat; c.started=true; c.msgs=[]; c.turns=[]; c.err=''; chatSend(null); break; }
    case 'chat-send': { const inp=$('#chatIn'); const txt=(inp?inp.value:'').trim(); if(!txt) return; chatSend(txt); break; }
    case 'chat-stop': { if(ui.chat.ctl) ui.chat.ctl.abort(); break; }
    case 'chat-reset': { const c=ui.chat; if(c.ctl) c.ctl.abort(); c.started=false; c.msgs=[]; c.turns=[]; c.busy=false; c.err=''; render(); break; }
    case 'chat-ko': { const m=ui.chat.msgs[+d.i]; if(m){ m.show=!m.show; render(); } break; }
    case 'chat-hint': { const m=ui.chat.msgs[+d.i]; if(m){ m.showHint=!m.showHint; render(); } break; }
    case 'back-words': ui.theme=null; ui.openWord=null; render(); break;
    case 'back-sents': ui.group=null; ui.openWord=null; TTS.stop(); render(); break;
    case 'back-patterns': ui.pattern=null; ui.build=null; ui.slot=null; render(); break;
    case 'back-reading': ui.reading=null; ui.openSent=null; TTS.stop(); render(); break;
    case 'back-dialog': ui.dialog=null; TTS.stop(); render(); break;
    case 'shadow': { const g=SGROUPS.find(x=>x.id===d.group); if(g){ const list=[]; groupSents(g).forEach(s=>{ list.push(s.en); list.push(s.en); }); TTS.seq(list, 1200); toast('각 문장을 두 번씩 읽어 줘요. 따라 말하세요.'); } break; }
    case 'build-start': { const p=PATTERNS.find(x=>x.id===d.pattern); if(p) startBuild(p); render(); break; }
    case 'build-check': { const bld=ui.build; if(!bld) return; bld.result = J(bld.picked.map(x=>x.w))===bld.en? 'ok':'bad'; render(); TTS.speak(bld.en); break; }
    case 'build-reset': { const bld=ui.build; if(bld){ bld.picked=[]; bld.result=null; render(); } break; }
    case 'build-next': { const bld=ui.build; if(bld){ bld.idx++; loadBuild(); render(); } break; }
    case 'pattern-done': state.patterns[d.pattern]={ts:Date.now()}; touchStreak(); commit(); toast('익힘으로 표시했어요'); render(); break;
    case 'pattern-undone': delete state.patterns[d.pattern]; commit(); render(); break;
    case 'read-all': { const r=READINGS.find(x=>x.id===ui.reading); if(r) TTS.seq(r.sents.map(s=>disp(s[0]))); break; }
    case 'toggle-ko': ui.showAll=!ui.showAll; render(); break;
    case 'tts-stop': TTS.stop(); break;
    case 'reading-done': state.readings[d.reading]={ts:Date.now()}; touchStreak(); commit(); toast('읽음으로 표시했어요'); render(); break;
    case 'reading-undone': delete state.readings[d.reading]; commit(); render(); break;
    case 'sheet-close': $('#sheet').innerHTML=''; break;
    case 'reset-ask': ui.confirmReset=true; render(); break;
    case 'reset-no': ui.confirmReset=false; render(); break;
    case 'reset-yes': { const s=state.settings; state=defaults(); state.settings=s; ui.confirmReset=false; commit(); toast('기록을 모두 지웠어요'); render(); break; }
    case 'copy-export': { const txt=JSON.stringify(state); const ta=$('#exportTa'); const fallback=()=>{ if(ta){ ta.focus(); ta.select(); } toast('글을 길게 눌러 직접 복사하세요'); }; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('복사했어요'), fallback); } else fallback(); break; }
    case 'do-import': { const ta=$('#importTa'); const txt=(ta?ta.value:'').trim(); try{ const o=JSON.parse(txt); if(!o||typeof o!=='object'||!o.words) throw 0; state=migrate(o); commit(); ui.importText=''; toast('진도를 가져왔어요'); render(); }catch(err){ ui.importText=txt; toast('형식이 맞지 않아요'); render(); } break; }
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='chatIn'){ e.preventDefault(); document.querySelector('[data-act="chat-send"]')?.click(); return; }
  if(!S) return; const it=cur(); if(!it) return;
  if(e.key==='Enter'){ e.preventDefault();
    if(S.answered){ S.i++; S.answered=false; renderSession(); return; }
    if(it.t==='learn'){ S.i++; renderSession(); return; }
    if(it.t==='slearn'){ if(it.stage>0 && !it.reveal){ it.reveal=true; renderSession(); TTS.speak(it.s.en); } else { S.i++; renderSession(); } return; }
    if(it.t==='dline'){ if(!it.mine){ S.i++; renderSession(); } else if(!it.reveal){ it.reveal=true; renderSession(); TTS.speak(lineEn(it.line), {who:it.who}); } return; }
    if(it.t==='squiz'){ if(it.mode==='order'){ document.querySelector('[data-act="s-check-order"]')?.click(); } else if(it.mode==='recall'){ if(it.revealed) return; const inp=$('#sentIn'); if(inp&&inp.value.trim()) document.querySelector('[data-act="s-check-text"]')?.click(); else document.querySelector('[data-act="s-show"]')?.click(); } else if(it.mode==='dict'){ if(!it.revealed) document.querySelector('[data-act="s-show"]')?.click(); } return; } }
  else if(/^[1-4]$/.test(e.key) && !S.answered && !(document.activeElement && document.activeElement.tagName==='INPUT')){ if(it.t==='quiz'){ const b=document.querySelector(`[data-opt="${+e.key-1}"]`); if(b) b.click(); } else if(it.t==='squiz'&&it.mode==='cloze'){ const b=document.querySelector(`[data-sopt="${+e.key-1}"]`); if(b) b.click(); } }
});
loadLocal(); applySkin(); TTS.init(); render(); Sync.init(); AI.init();
})();
</script>
