<style>
/* Layout: one centered column (max 640px) with a fixed bottom tab bar. Default look: white & black (mono); other skins via html[data-skin]. */
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --fg:#111111; --muted:#666666; --line:#E2E2DE; --soft:#EFEFEB;
  --accent:#111111; --accent-ink:#FFFFFF; --accent-soft:#E6E6E2;
  --ok:#157A43; --ok-soft:#E1F5E9; --bad:#B83229; --bad-soft:#FBE6E4; --warn:#8A5B00; --warn-soft:#FFF3D6;
  --shadow:0 6px 24px rgba(0,0,0,.08);
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
:root[data-skin="light"]{ --accent:#2E54D3; --accent-soft:#E4EAFB; --bg:#F4F6FA; --line:#DCE2EA; --soft:#EEF1F6; --fg:#17202B; --muted:#5E6975 }
:root[data-skin="red"]{ --bg:#0A0A0C; --surface:#151518; --fg:#F3F1EF; --muted:#9C9AA0; --line:#2A2A30; --soft:#1F1F24; --accent:#F0453E; --accent-ink:#0A0A0C; --accent-soft:#3B1613; --ok:#3FD98B; --ok-soft:#10301F; --bad:#FFA447; --bad-soft:#3A2410; --warn:#FFD166; --warn-soft:#3A2F10; --shadow:0 8px 28px rgba(0,0,0,.55); color-scheme:dark }
:root[data-skin="navy"]{ --bg:#0A1220; --surface:#121C30; --fg:#EEF3FA; --muted:#93A3BC; --line:#243350; --soft:#1A2740; --accent:#4FA8FF; --accent-ink:#0A1220; --accent-soft:#143052; --ok:#3FD98B; --ok-soft:#10301F; --bad:#FF7A7A; --bad-soft:#3A1818; --warn:#FFD166; --warn-soft:#3A2F10; --shadow:0 8px 28px rgba(0,0,0,.55); color-scheme:dark }
:root[data-skin="dark"]{ --bg:#0F0F10; --surface:#1A1A1C; --fg:#F2F2F2; --muted:#9A9A9A; --line:#2C2C2F; --soft:#232326; --accent:#F2F2F2; --accent-ink:#111111; --accent-soft:#2E2E31; --ok:#3FD98B; --ok-soft:#10301F; --bad:#FF8A80; --bad-soft:#3A1A18; --warn:#FFD166; --warn-soft:#3A2F10; --shadow:0 8px 28px rgba(0,0,0,.55); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 96px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.accent{background:var(--accent-soft);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.hero{border-top:3px solid var(--accent);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.sec-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;font-weight:600;font-size:15.5px;background:var(--soft);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.big{width:100%;min-height:54px;font-size:17px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.okbtn{background:var(--ok-soft);color:var(--ok)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:700;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.item:hover{border-color:var(--accent)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:16px}
.item .s{font-size:13.5px;color:var(--muted);margin-top:2px}
.item .chev{color:var(--muted);flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--ok)}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;min-height:36px;margin-bottom:8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav .in{max-width:640px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft);width:100%;text-align:left}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;color:var(--muted)}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--ok);color:#fff}
.step .b{flex:1;min-width:0}
.step .t{font-weight:600;font-size:14.5px}
.step .bar{height:5px;margin-top:5px}
.step .pc{font-size:12.5px;color:var(--muted);white-space:nowrap}
.key{display:flex;flex-direction:column;gap:8px}
.key li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-weight:500}
.key li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:9px}
.key ul{margin:0;padding:0}
.body p{margin-bottom:10px}
.body p:last-child{margin-bottom:0}
.prompt{background:var(--soft);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.prompt .t{font-weight:700;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.prompt pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:14px;line-height:1.55}
.prompt .tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15.5px;font-weight:500;min-height:48px}
.opt .k{width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.feedback{margin-top:10px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14.5px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;margin-top:2px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.check.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
textarea.ta{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:15px;font-family:var(--mono);resize:vertical;line-height:1.55}
textarea.ta.small{min-height:90px;font-size:12.5px}
.answer{white-space:pre-wrap;word-break:break-word;line-height:1.65}
.note{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:14.5px}
.note.warn{background:var(--warn-soft)}
.layer{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:flex;flex-direction:column}
.layer .in{max-width:640px;width:100%;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;flex:1;min-width:0}
.layer .head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.layer .head .bar{flex:1}
.layer .head .lbl{font-size:13px;color:var(--muted);white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:var(--shadow)}
.qcard .tag{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.qcard .q{font-size:20px;font-weight:600;margin-top:8px;line-height:1.4}
.foot{margin-top:auto;padding-top:16px;display:flex;gap:10px}
.foot .btn{flex:1}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.sum .card{text-align:center;padding:14px 8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:600;color:var(--muted)}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skin{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--soft);text-align:left}
.skin.on{border-color:var(--accent)}
.skin .sw{display:flex;gap:4px}
.skin .sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}
.skin span{font-size:13px;font-weight:600}
.guide h3{font-size:16px;margin:16px 0 6px}
.guide ol,.guide ul{margin:0;padding-left:20px}
.guide li{margin:4px 0}
/* ---- 2026-11 화면 다듬기: 교육 사이트형 레이아웃 ---- */
html{scroll-behavior:smooth}
body{font-size:16px;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere}
.h2{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:30px 0 12px}
.sec-title{font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:var(--fg);margin:26px 0 10px}
.eyb{font-size:13px;font-weight:600;color:var(--accent)}
:root[data-skin="mono"]:not([style]) .eyb,:root[data-skin="dark"] .eyb{color:var(--muted)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.bar.big{height:6px;margin:4px 0 8px}

/* 머리말 */
.apphead{margin:6px 0 16px}
.brand2 h1{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.brand2 p{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.5}

/* 홈: 이어서 학습 */
.hero2{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;gap:16px;align-items:center}
.hero-meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.hero-t{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.hero-k{color:var(--muted);font-size:14.5px;line-height:1.6}
.ring{position:relative;width:64px;height:64px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .ring-bg{stroke:var(--soft)}
.ring .ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring b{position:relative;font-size:17px;font-weight:800;letter-spacing:-.02em}
.ring b small{font-size:11px;font-weight:700;margin-left:1px}
.week{border-top:1px solid var(--line);padding-top:12px}
.week .wk-t{font-size:13px;font-weight:700}
.week .wk-s{font-size:12.5px;color:var(--muted)}
.week ol{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week li{display:flex;flex-direction:column;align-items:center;gap:4px}
.week li i{width:30px;height:30px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;color:var(--accent-ink)}
.week li.on i{background:var(--accent)}
.week li.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.week li small{font-size:11.5px;color:var(--muted);font-weight:600}
.week li.today small{color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 0 0;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.stats>div{padding:12px 10px;text-align:center}
.stats>div+div{border-left:1px solid var(--line)}
.stats dt{font-size:12.5px;color:var(--muted)}
.stats dd{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stats dd small{font-size:13px;font-weight:600;color:var(--muted);margin-left:1px}

/* 홈: 단계 로드맵 (순서가 있는 단계라 번호를 씀) */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative}
.timeline li+li::before{content:"";position:absolute;left:21px;top:-10px;height:20px;width:2px;background:var(--line)}
.tl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px 10px 8px;border-radius:14px;margin:4px 0}
.tl:hover{background:var(--soft)}
.tl-n{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted);flex:none;margin-left:0}
.tl.on .tl-n{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tl.done .tl-n{border-color:var(--ok);background:var(--ok);color:#fff}
.tl-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tl-t{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.tl-s{font-size:12.5px;color:var(--muted)}
.tl.on .tl-s{color:var(--accent)}
:root[data-skin="mono"]:not([style]) .tl.on .tl-s{color:var(--fg)}
.tl .bar{height:4px;margin-top:6px}
.tl.done .bar>i{background:var(--ok)}

/* 커리큘럼 */
.stagebox{margin-top:22px;scroll-margin-top:12px}
.sb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sb-head h2{font-size:17px;font-weight:800;letter-spacing:-.015em}
.sb-head p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.sb-pc{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:2px}
.stagebox>.bar{height:4px;margin:10px 0 8px}
.curri{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.curri li+li{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;min-height:60px}
.lrow:hover{background:var(--soft)}
.lr-n{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.lrow.done .lr-n{background:var(--ok-soft);color:var(--ok)}
.lrow.cur{background:var(--accent-soft)}
.lrow.cur .lr-n{background:var(--accent);color:var(--accent-ink)}
.lr-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lr-t{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.lrow.done .lr-t{color:var(--muted)}
.lr-s{font-size:12.5px;color:var(--muted)}

/* 수업 화면 */
.lhead{position:sticky;top:0;z-index:15;margin:-14px -16px 0;padding:8px 16px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lh-in{display:flex;align-items:center;justify-content:space-between}
.lh-in .back{margin:0}
.lh-pos{font-size:13px;color:var(--muted);font-weight:600}
.readbar{height:3px;background:var(--line);margin:4px -16px 0}
.readbar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.lhero{padding:18px 0 4px;display:flex;flex-direction:column;gap:8px}
.lhero h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.lhero .pill{gap:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
section[id^="sec-"]{scroll-margin-top:64px}
.keycard{background:var(--accent-soft);border-radius:18px;padding:4px 18px 18px;margin-top:16px}
.keycard .h2{margin-top:16px}
.keycard .key li{font-size:15.5px;line-height:1.6}
.prose{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px}
.prose p{font-size:16.5px;line-height:1.85;margin:0 0 16px;max-width:38em}
.prose p:last-child{margin-bottom:0}
.prompt pre{font-size:13.5px}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.qbox.is-ok{border-color:var(--ok)}
.qbox.is-bad{border-color:var(--bad)}
.qnum{font-size:12.5px;font-weight:700;color:var(--muted)}
.qq{font-size:16.5px;font-weight:700;line-height:1.5;margin-top:4px;letter-spacing:-.01em}
.opt{transition:border-color .15s,background .15s}
.opt:not([disabled]):hover{border-color:var(--accent)}
.qsum{font-size:14.5px;font-weight:600;color:var(--muted);padding:2px 4px}
.qsum.ok{color:var(--ok)}
.finish{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.done-note{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-radius:14px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pg{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
.pg.next{text-align:right;grid-column:2}
.pg small{font-size:12px;color:var(--muted);font-weight:600}
.pg span{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg:hover{border-color:var(--accent)}
@media (min-width:600px){.lhero h1{font-size:30px}.prose{padding:26px 28px}}

.hublink{display:none!important}
.hub2{display:inline-flex;align-items:center;min-height:32px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:2px}
.hub2:hover{color:var(--fg)}
.lsearch{margin:0 0 6px}
.lsearch input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);color:var(--fg);font:inherit;font-size:15.5px}
.lsearch input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#lempty{margin:14px 2px}
.feedback .qx{margin:6px 0 0;font-weight:500;color:var(--fg);line-height:1.6;font-size:14.5px}
.keycard ul.key{margin:0;padding:0}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="app" class="app"></div>
<nav class="nav" id="nav"></nav>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="lessons.js"></script>
<script>
(function(){
'use strict';
const APP=Object.assign({title:'학습',subtitle:'',key:'study_v1',homeDone:'모두 마쳤어요.',cards:{templates:['모음','복사해서 쓰는 항목'],lab:['도우미','클로드에게 바로 묻기'],diag:['진단','내 것을 진단받기']},sec:{steps:'따라 하기',prompts:'클로드에게 물어보기'},templates:{title:'모음',subtitle:'',note:''},lab:{title:'도우미',subtitle:'바로 묻기',diagTab:'진단',askLabel:'물어볼 말',diagLabel:'진단받을 내용',askPh:'',diagPh:'',tip:''},diagPrompt:function(t){return 'Reply ONLY with one JSON object {"score":1-5,"level":"","good":"","improve":"","rewritten":""}. Korean. Input:\n'+t;},guide:'',tts:null}, window.APP||{});
document.title=APP.title;
const STAGES=window.CS_STAGES||[]; const TEMPLATES=window.CS_TEMPLATES||[];
const LESSONS=[]; STAGES.forEach((s,si)=>s.lessons.forEach((l,li)=>{ l.stage=s.id; l.stageTitle=s.title; l.order=si*100+li; LESSONS.push(l); }));
const LMAP={}; LESSONS.forEach(l=>LMAP[l.id]=l);
const DAY=86400000;
const KEY=APP.key;
const defaults=()=>({v:1, lessons:{}, quiz:{ok:0,ng:0}, streak:{count:0,last:''}, daily:{}, lab:0, miss:{}, settings:{skin:'auto'}, updatedAt:0});
let state=defaults();
function migrate(s){ const d=defaults(); if(!s||typeof s!=='object') return d; const DEF=defaults(); const o=Object.assign(d,s); o.settings=Object.assign({},DEF.settings,s.settings||{}); o.lessons=s.lessons||{}; o.quiz=Object.assign(DEF.quiz,s.quiz||{}); o.streak=Object.assign(DEF.streak,s.streak||{}); o.daily=s.daily||{}; return o; }
function loadLocal(){ try{ const raw=localStorage.getItem(KEY); if(raw) state=migrate(JSON.parse(raw)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function commit(){ state.updatedAt=Date.now(); saveLocal(); Sync.schedule(); applySkin(); }
const SKINS=[['auto','기기 설정 따라',['#F7F7F5','#0F0F10','#777777']],['mono','흰색·검정',['#F7F7F5','#FFFFFF','#111111']],['light','흰색·파랑',['#F4F6FA','#FFFFFF','#2E54D3']],['dark','검정·흰색',['#0F0F10','#1A1A1C','#F2F2F2']],['red','검정·빨강',['#0A0A0C','#151518','#F0453E']],['navy','남색·하늘',['#0A1220','#121C30','#4FA8FF']]];
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null; if(darkMQ&&darkMQ.addEventListener) darkMQ.addEventListener('change',()=>applySkin());
function applySkin(){ let sk=(state.settings&&state.settings.skin)||'auto'; if(sk==='auto') sk=(darkMQ&&darkMQ.matches)?'dark':'mono'; const r=document.documentElement; r.setAttribute('data-skin', sk); if(APP.accent && sk==='mono'){ r.style.setProperty('--accent', APP.accent); r.style.setProperty('--accent-soft', APP.accent+'1A'); } else { r.style.removeProperty('--accent'); r.style.removeProperty('--accent-soft'); } }
const Sync={ ref:null, timer:null, writing:false, dirty:false, status:'local',
  async init(){ try{ if(!window.claude||typeof window.claude.use!=='function') return; const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]); if(!db||!user) return; const id=await user.id(); if(!id) return; this.ref=db.doc('data/users/'+id+'/progress'); const snap=await this.ref.get(); if(snap.exists){ const remote=snap.data(); if((remote.updatedAt||0)>(state.updatedAt||0)){ state=migrate(JSON.parse(JSON.stringify(remote))); saveLocal(); applySkin(); render(); } else if((state.updatedAt||0)>(remote.updatedAt||0)) this.push(); } else if(state.updatedAt) this.push(); this.status='cloud'; if(ui.view==='more') render(); }catch(e){ console.warn('sync',e); } },
  schedule(){ if(!this.ref) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.push(),1500); },
  async push(){ if(!this.ref) return; if(this.writing){ this.dirty=true; return; } this.writing=true; try{ await this.ref.set(JSON.parse(JSON.stringify(state))); }catch(e){ console.warn('push',e); } finally{ this.writing=false; if(this.dirty){ this.dirty=false; this.push(); } } }
};
const AI={ fn:null, ready:false, checked:false, async init(){ try{ if(window.claude&&typeof window.claude.use==='function'){ this.fn=await window.claude.use('sample'); this.ready=!!this.fn; } }catch(e){} this.checked=true; if(ui.view==='lab') render(); } };

const $=s=>document.querySelector(s);
const josa=w=>{ const c=String(w||'').trim().slice(-1).charCodeAt(0); return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'은':'는'; };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayStr(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function touchStreak(){ const t=today(); const s=state.streak; if(s.last===t) return; const y=dayStr(Date.now()-DAY); s.count=(s.last===y)? s.count+1:1; s.last=t; }
function streakNow(){ const s=state.streak; if(!s.last) return 0; const t=today(), y=dayStr(Date.now()-DAY); return (s.last===t||s.last===y)? s.count:0; }
const lp=id=>state.lessons[id]||{};
const doneCount=()=>LESSONS.filter(l=>lp(l.id).done).length;
const chev='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
function copyText(txt){ const done=()=>toast('복사했어요'); const fail=()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 안 돼요. 글을 길게 눌러 직접 복사하세요'); } document.body.removeChild(ta); }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail); else fail(); }

const ui={view:'home', stage:null, lesson:null, more:'guide', confirmReset:false, importText:'', dict:{}, dictTyped:{}, lab:{prompt:'', answer:'', busy:false, ctl:null, err:'', diag:null, mode:'ask'}};
function go(view, extra){ ui.view=view; Object.assign(ui, extra||{}); ui.confirmReset=false; render(); window.scrollTo(0,0); }
function render(){ const v=ui.view; $('#app').innerHTML = v==='home'?viewHome(): v==='lessons'?viewLessons(): v==='templates'?viewTemplates(): v==='lab'?viewLab(): viewMore(); renderNav(); if(v==='lessons'&&!ui.lesson) filterLessons(); }
function filterLessons(){ const q=(ui.lq||'').trim().toLowerCase(); document.querySelectorAll('.curri li').forEach(li=>{ li.hidden=!!q && !(li.dataset.q||'').includes(q); }); document.querySelectorAll('.stagebox').forEach(sb=>{ sb.hidden=!!q && !sb.querySelector('.curri li:not([hidden])'); }); const e=document.getElementById('lempty'); if(e) e.hidden=!(q && !document.querySelector('.curri li:not([hidden])')); }
function renderNav(){ const items=[['home','오늘','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>'],['lessons','수업','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h12"/></svg>'],['templates',APP.nav||'모음','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>'],['lab',APP.navLab||'도우미','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>'],['more','더보기','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>']];
  $('#nav').innerHTML='<div class="in">'+items.map(([k,l,i])=>`<button class="${ui.view===k?'on':''}" data-nav="${k}" aria-label="${l}">${i}<span>${l}</span></button>`).join('')+'</div>'; }

/* ---- 공용 조각 ---- */
const icClock='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const icCheck='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
function ring(pct){ const r=26, c=2*Math.PI*r; return `<span class="ring" role="img" aria-label="전체 진도 ${pct}%"><svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" class="ring-bg"/><circle cx="32" cy="32" r="${r}" class="ring-fg" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}"/></svg><b class="num">${pct}<small>%</small></b></span>`; }
function activeDays(){ const set=new Set(); LESSONS.forEach(l=>{ const t=lp(l.id).ts; if(t) set.add(dayStr(t)); }); const s=state.streak; if(s.last && streakNow()>0){ const base=new Date(s.last+'T12:00:00').getTime(); for(let k=0;k<s.count && k<7;k++) set.add(dayStr(base-k*DAY)); } return set; }
function weekStrip(){ const on=activeDays(); const W='일월화수목금토'; let h=''; for(let i=6;i>=0;i--){ const ts=Date.now()-i*DAY; const ds=dayStr(ts); const a=on.has(ds); h+=`<li class="${a?'on':''} ${i===0?'today':''}"><i>${a?icCheck:''}</i><small>${i===0?'오늘':W[new Date(ts).getDay()]}</small></li>`; } const n=streakNow(); return `<div class="week"><div class="row between"><span class="wk-t">최근 7일</span><span class="wk-s">${n>0? n+'일째 이어서 배우는 중':'오늘 한 수업으로 시작해요'}</span></div><ol aria-label="최근 7일 학습 기록">${h}</ol></div>`; }
const stageName=t=>String(t).replace(/^\d+단계 · /,'');

/* ---- 홈 ---- */
function viewHome(){
  const next=LESSONS.find(l=>!lp(l.id).done); const dn=doneCount(); const total=LESSONS.length; const q=state.quiz; const acc=(q.ok+q.ng)?Math.round(q.ok/(q.ok+q.ng)*100):null; const tasks=LESSONS.filter(l=>lp(l.id).task).length;
  const pct=total? Math.round(dn/total*100):0;
  const stages=STAGES.map((s,i)=>{ const n=s.lessons.length; const d=s.lessons.filter(l=>lp(l.id).done).length; const sp=Math.round(d/n*100); const cur= next && next.stage===s.id; return `<li><button class="tl ${sp===100?'done':cur?'on':''}" data-stage="${s.id}"><span class="tl-n">${sp===100?icCheck:i+1}</span><span class="tl-b"><span class="tl-t">${esc(stageName(s.title))}</span><span class="tl-s">${cur? '지금 배우는 단계 · ':''}${d}/${n} 수업</span><span class="bar"><i style="width:${sp}%"></i></span></span>${chev}</button></li>`; }).join('');
  const started=next && (lp(next.id).quiz||lp(next.id).task);
  const hero = next? `<div class="hero2">
      <div class="hero-top">${ring(pct)}<div class="hero-meta"><div class="eyb">${esc(stageName(next.stageTitle))} · ${LESSONS.indexOf(next)+1}번째 수업</div><h2 class="hero-t">${esc(next.title)}</h2><div class="meta">${icClock}<span>약 ${next.min}분</span><span class="sep"></span><span>${dn}/${total} 마침</span></div></div></div>
      <p class="hero-k">${esc(next.key[0])}</p>
      <button class="btn primary big" data-lesson="${next.id}">${started?'이어서 학습':'수업 시작'}</button>
      ${weekStrip()}
    </div>` : `<div class="hero2"><div class="hero-top">${ring(100)}<div class="hero-meta"><div class="eyb">전체 ${total}개 수업 완료</div><h2 class="hero-t">모두 마쳤어요</h2></div></div><p class="hero-k">${esc(APP.homeDone)}</p><button class="btn primary big" data-act="review">복습 퀴즈 풀기</button>${weekStrip()}</div>`;
  return `<header class="apphead"><a class="hub2" href="../index.html">‹ 전체 앱</a><div class="brand2"><h1>${esc(APP.title)}</h1><p>${esc(APP.subtitle)}</p></div></header>
  ${hero}
  <dl class="stats"><div><dt>마친 수업</dt><dd class="num">${dn}<small>/${total}</small></dd></div><div><dt>퀴즈 정답률</dt><dd class="num">${acc===null?'–':acc+'<small>%</small>'}</dd></div><div><dt>실습 완료</dt><dd class="num">${tasks}</dd></div></dl>
  <h2 class="h2">학습 로드맵</h2>
  <ol class="timeline">${stages}</ol>
  <h2 class="h2">바로 가기</h2>
  <div class="grid2">
    <button class="item" data-act="review" ${dn||missCount()?'':'disabled'}><div class="body"><div class="t">복습 퀴즈</div><div class="s">${missCount()? `틀린 문제 ${missCount()}개부터 다시 풀어요`: dn? '마친 수업에서 10문제':'수업 하나를 마치면 열려요'}</div></div>${chev}</button>
    <button class="item" data-nav="templates"><div class="body"><div class="t">${esc(APP.cards.templates[0])}</div><div class="s">${esc(APP.cards.templates[1])} ${TEMPLATES.reduce((a,c)=>a+c.items.length,0)}개</div></div>${chev}</button>
    <button class="item" data-nav="lab"><div class="body"><div class="t">${esc(APP.cards.lab[0])}</div><div class="s">${esc(APP.cards.lab[1])}</div></div>${chev}</button>
    <button class="item" data-nav="lab" data-mode="diag"><div class="body"><div class="t">${esc(APP.cards.diag[0])}</div><div class="s">${esc(APP.cards.diag[1])}</div></div>${chev}</button>
  </div>`;
}

/* ---- 수업 ---- */
function viewLessons(){
  if(ui.lesson){ const l=LMAP[ui.lesson]; if(l) return viewLesson(l); ui.lesson=null; }
  const next=LESSONS.find(l=>!lp(l.id).done); const dn=doneCount(); const total=LESSONS.length;
  const groups=STAGES.map((s,si)=>{ const n=s.lessons.length; const d=s.lessons.filter(l=>lp(l.id).done).length;
    const rows=s.lessons.map(l=>{ const p=lp(l.id); const cur=next&&next.id===l.id; const meta=[`${l.min}분`]; if(p.quiz) meta.push('퀴즈 '+p.quiz.ok+'/'+p.quiz.total); if(p.task) meta.push('실습 완료');
      return `<li data-q="${esc((l.title+' '+l.key.join(' ')).toLowerCase())}"><button class="lrow ${p.done?'done':''} ${cur?'cur':''}" data-lesson="${l.id}"><span class="lr-n num">${p.done?icCheck:LESSONS.indexOf(l)+1}</span><span class="lr-b"><span class="lr-t">${esc(l.title)}</span><span class="lr-s">${meta.join(' · ')}</span></span>${cur?'<span class="pill accent">다음</span>':chev}</button></li>`; }).join('');
    return `<section class="stagebox" id="stage-${s.id}"><div class="sb-head"><div><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p></div><span class="sb-pc num">${d}/${n}</span></div><div class="bar"><i style="width:${Math.round(d/n*100)}%"></i></div><ol class="curri">${rows}</ol></section>`; }).join('');
  return `<header class="apphead"><div class="brand2"><h1>커리큘럼</h1><p>${STAGES.length}단계 ${total}수업 · ${dn}개 마침</p></div></header>
  <div class="lsearch"><input id="lsearch" type="search" placeholder="수업 찾기 (제목·핵심 내용)" aria-label="수업 찾기" value="${esc(ui.lq||'')}" autocomplete="off"></div><p id="lempty" class="muted small" hidden>찾는 수업이 없어요. 다른 낱말로 찾아보세요.</p>
  <div class="bar big"><i style="width:${total?Math.round(dn/total*100):0}%"></i></div>${groups}`;
}
function viewLesson(l){
  const p=lp(l.id); const qz=ui.qz||{};
  const formulas=(l.formulas||[]).map((f,i)=>`<div class="prompt"><div class="t">${esc(f[0])}</div><pre>${esc(f[1])}</pre><p class="small muted" style="margin-top:6px">${esc(f[2]||'')}</p><div class="tools"><button class="btn sm" data-copyf="${l.id}:${i}">복사</button>${APP.tts?`<button class="btn sm ghost" data-say="${l.id}:${i}">▶ 듣기</button>`:''}</div></div>`).join('');

const stripFence=t=>String(t==null?'':t).replace(/```[a-zA-Z]*\n?/g,'');
async function labSend(){ const L=ui.lab; if(L.busy||!AI.fn) return; const txt=($('#labIn')?$('#labIn').value:'').trim(); if(!txt){ toast('보낼 글을 먼저 쓰세요'); return; } L.prompt=txt; L.busy=true; L.err=''; L.answer=''; state.lab++; touchStreak(); commit(); render(); L.ctl=new AbortController();
  try{ const r=await AI.fn(txt, {signal:L.ctl.signal, cache:false, onText:({text})=>{ L.answer=stripFence(text); const el=document.querySelector('.answer'); if(el) el.textContent=text; else render(); }}); L.answer=stripFence(r.text); }
  catch(e){ L.err=labErr(e); if(e&&e.text) L.answer=e.text; }
  L.busy=false; L.ctl=null; render(); }
async function labDiag(){ const L=ui.lab; if(L.busy||!AI.fn) return; const txt=($('#labIn')?$('#labIn').value:'').trim(); if(!txt){ toast(APP.diagEmpty||'진단받을 내용을 먼저 쓰세요'); return; } L.prompt=txt; L.busy=true; L.err=''; L.diag=null; state.lab++; touchStreak(); commit(); render(); L.ctl=new AbortController();
  const p=APP.diagPrompt(txt);
  try{ const r=await AI.fn.json(p, {signal:L.ctl.signal, cache:false, modelTier:'quick'}); const o=(r&&typeof r==='object')?r:{}; L.diag={score:String(o.score||'?'), level:String(o.level||''), good:String(o.good||''), improve:String(o.improve||''), rewritten:String(o.rewritten||'')}; }
  catch(e){ L.err=labErr(e); }
  L.busy=false; L.ctl=null; render(); }
function labErr(e){ const code=e&&e.code; const map={not_granted:'이 앱이 Claude를 쓰도록 허용하지 않았어요. 허용하면 쓸 수 있어요.', sampling_disabled:'이 계정에서는 실습실을 쓸 수 없어요.', rate_limited:'요청이 너무 많아요. 잠시 뒤 다시 보내 주세요.', session_expired:'로그인이 풀렸어요. 다시 로그인해 주세요.', cancelled:'', invalid_json:'답을 읽지 못했어요. 한 번 더 눌러 주세요.', refused:'이 내용에는 답할 수 없대요. 다른 내용으로 해 보세요.', empty_completion:'답이 비어 있어요. 한 번 더 보내 주세요.'}; if(code==='not_granted'||code==='sampling_disabled') AI.ready=false; return code in map? map[code] : '연결에 문제가 생겼어요. 잠시 뒤 다시 보내 주세요.'; }

/* ---- 복습 퀴즈 ---- */
let S=null;
const missMap=()=>{ const M=state.miss||{}; Object.keys(M).forEach(k=>{ const [lid,qi]=k.split(':'); if(!LMAP[lid]||!LMAP[lid].quiz[+qi]) delete M[k]; }); return M; };
const missCount=()=>Object.keys(missMap()).length;
function startReview(){ const M=missMap(); const miss=[], rest=[]; LESSONS.forEach(l=>l.quiz.forEach((q,qi)=>{ const k=l.id+':'+qi; if(M[k]) miss.push({l,q,k}); else if(lp(l.id).done) rest.push({l,q,k}); })); const pick=shuffle(miss).slice(0,10); const q=shuffle(pick.concat(shuffle(rest).slice(0,10-pick.length))); if(!q.length){ toast('마친 수업이 없어요'); return; } S={q, i:0, ok:0, ng:0, answered:false, missIn:pick.length}; renderSession(); }
function renderSession(){ const L=$('#layer'); if(!S){ L.innerHTML=''; return; } if(S.i>=S.q.length){ const acc=Math.round(S.ok/S.q.length*100); L.innerHTML=`<div class="layer"><div class="in"><div class="head"><span class="lbl">복습 퀴즈</span></div><div class="qcard" style="text-align:center"><div class="tag">완료</div><div class="q" style="font-size:26px">${acc>=80?'잘했어요!':acc>=50?'좋아요':'다시 한번 읽어 봐요'}</div><div class="sum"><div class="card"><div class="stat"><b class="num">${S.ok}</b><span>정답</span></div></div><div class="card"><div class="stat"><b class="num">${S.ng}</b><span>오답</span></div></div><div class="card"><div class="stat"><b class="num">${acc}%</b><span>정답률</span></div></div></div><p class="muted small">${missCount()? `다시 볼 틀린 문제가 ${missCount()}개 남았어요. 다음 복습에 먼저 나와요.`:'틀린 문제를 모두 다시 맞혔어요.'}</p></div><div class="foot" style="flex-direction:column"><button class="btn primary" data-act="exit">홈으로</button></div></div></div>`; return; }
  const it=S.q[S.i]; const q=it.q; L.innerHTML=`<div class="layer"><div class="in"><div class="head"><button class="btn sm ghost" data-act="exit">나가기</button><div class="bar"><i style="width:${Math.round(S.i/S.q.length*100)}%"></i></div><span class="lbl num">${S.i+1} / ${S.q.length}</span></div>
  <div class="qcard"><div class="tag">${esc(it.l.title)}</div><div class="q">${esc(q.q)}</div></div>
  <div class="opts" style="margin-top:14px">${q.o.map((o,oi)=>{ let cls=''; if(S.answered){ if(oi===q.a) cls='right'; else if(oi===it.picked) cls='wrong'; else cls='dim'; } return `<button class="opt ${cls}" data-ropt="${oi}" ${S.answered?'disabled':''}><span class="k">${oi+1}</span><span>${esc(o)}</span></button>`; }).join('')}</div>
  ${S.answered? (it.picked===q.a? `<div class="feedback ok">맞았어요!${q.x?`<p class="qx">${esc(q.x)}</p>`:''}</div>`:`<div class="feedback bad">정답은 ${q.a+1}번. ${q.x?`<p class="qx">${esc(q.x)}</p><p class="qx">수업 '${esc(it.l.title)}'에서 더 볼 수 있어요.</p>`:`수업 '${esc(it.l.title)}'을 다시 보세요.`}</div>`):''}
  <div class="foot">${S.answered? `<button class="btn primary" data-act="rnext">다음</button>`:''}</div></div></div>`; }

function promptText(ref){ if(ref.startsWith('t:')){ const [,ci,ti]=ref.split(':'); return TEMPLATES[+ci].items[+ti][1]; } const [lid,i]=ref.split(':'); return LMAP[lid].prompts[+i][1]; }
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.jump){ const el=document.getElementById(d.jump); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if(d.nav){ if(d.mode) ui.lab.mode=d.mode; go(d.nav, {lesson:null, stage:null}); return; }
  if(d.stage){ go('lessons', {lesson:null}); const el=document.getElementById('stage-'+d.stage); if(el) el.scrollIntoView({block:'start'}); return; }
  if(d.lesson && !d.act){ ui.qz={}; go('lessons', {lesson:d.lesson}); return; }
  if(d.copy){ copyText(promptText(d.copy)); return; }
  if(d.copyf){ const [lid,i]=d.copyf.split(':'); copyText(LMAP[lid].formulas[+i][1]); return; }
  if(d.say){ const [lid,i]=d.say.split(':'); speak(LMAP[lid].formulas[+i][1], false); return; }
  if(d.dsay){ const [lid,i]=d.dsay.split(':'); speak(LMAP[lid].dict[+i][0], !!d.slow); return; }
  if(d.dcheck){ const [lid,i]=d.dcheck.split(':'); const ta=$('#dict-'+lid+'-'+i); const typed=(ta?ta.value:'').trim(); if(!typed){ toast('먼저 들리는 대로 써 보세요'); return; } ui.dictTyped[d.dcheck]=typed; ui.dict[d.dcheck]={pct:sim(typed, LMAP[lid].dict[+i][0])}; touchStreak(); commit(); render(); return; }
  if(d.dreset){ delete ui.dict[d.dreset]; ui.dictTyped[d.dreset]=''; render(); return; }
  if(d.copytext){ if(ui.lab.diag) copyText(ui.lab.diag.rewritten); return; }
  if(d.tolab){ ui.lab.prompt=promptText(d.tolab); ui.lab.mode='ask'; ui.lab.answer=''; go('lab'); toast(AI.ready? '보내기를 누르면 바로 물어봐요' : '[ ] 안을 바꾼 뒤 복사해서 클로드 앱에 붙여 넣으세요'); return; }
  if(d.qz!=null){ ui.qz=ui.qz||{}; if(ui.qz[d.qz]!=null) return; const l=LMAP[ui.lesson]; const q=l.quiz[+d.qz]; ui.qz[d.qz]=+d.oi; const ok=+d.oi===q.a; if(ok) state.quiz.ok++; else { state.quiz.ng++; state.miss=state.miss||{}; const mk=l.id+':'+d.qz; state.miss[mk]=(state.miss[mk]||0)+1; } const p=Object.assign({}, lp(l.id)); const answered=Object.keys(ui.qz).length; if(answered===l.quiz.length){ p.quiz={ok:l.quiz.filter((qq,qi)=>ui.qz[qi]===qq.a).length, total:l.quiz.length}; } state.lessons[l.id]=p; touchStreak(); commit(); render(); return; }
  if(d.ropt!=null){ if(!S||S.answered) return; const it=S.q[S.i]; it.picked=+d.ropt; S.answered=true; state.miss=state.miss||{}; if(it.picked===it.q.a){ S.ok++; state.quiz.ok++; if(it.k) delete state.miss[it.k]; } else { S.ng++; state.quiz.ng++; if(it.k) state.miss[it.k]=(state.miss[it.k]||0)+1; } touchStreak(); commit(); renderSession(); return; }
  if(d.labmode){ ui.lab.mode=d.labmode; ui.lab.err=''; render(); return; }
  if(d.skin){ state.settings.skin=d.skin; commit(); render(); return; }
  if(d.more){ ui.more=d.more; ui.confirmReset=false; render(); return; }
  switch(d.act){
    case 'back-lessons': ui.lesson=null; render(); window.scrollTo(0,0); break;
    case 'task': { const p=Object.assign({}, lp(d.lesson)); p.task=!p.task; state.lessons[d.lesson]=p; touchStreak(); commit(); render(); break; }
    case 'done': { const p=Object.assign({}, lp(d.lesson)); p.done=true; p.ts=Date.now(); state.lessons[d.lesson]=p; touchStreak(); commit(); toast('수업을 마쳤어요'); render(); break; }
    case 'undone': { const p=Object.assign({}, lp(d.lesson)); delete p.done; state.lessons[d.lesson]=p; commit(); render(); break; }
    case 'review': startReview(); break;
    case 'exit': S=null; renderSession(); render(); break;
    case 'rnext': if(S){ S.i++; S.answered=false; renderSession(); } break;
    case 'lab-send': labSend(); break;
    case 'lab-diag': labDiag(); break;
    case 'lab-stop': if(ui.lab.ctl) ui.lab.ctl.abort(); break;
    case 'lab-copy': { const t=($('#labIn')?$('#labIn').value:'').trim(); if(t) copyText(t); break; }
    case 'lab-clear': ui.lab.prompt=''; ui.lab.answer=''; ui.lab.diag=null; ui.lab.err=''; render(); break;
    case 'use-rewritten': if(ui.lab.diag){ ui.lab.prompt=ui.lab.diag.rewritten; ui.lab.mode='ask'; ui.lab.answer=''; render(); } break;
    case 'reset-ask': ui.confirmReset=true; render(); break;
    case 'reset-no': ui.confirmReset=false; render(); break;
    case 'reset-yes': { const s=state.settings; state=defaults(); state.settings=s; ui.confirmReset=false; commit(); toast('기록을 모두 지웠어요'); render(); break; }
    case 'copy-export': copyText(JSON.stringify(state)); break;
    case 'do-import': { const ta=$('#importTa'); const txt=(ta?ta.value:'').trim(); try{ const o=JSON.parse(txt); if(!o||typeof o!=='object'||!o.lessons) throw 0; state=migrate(o); commit(); ui.importText=''; toast('진도를 가져왔어요'); render(); }catch(err){ ui.importText=txt; toast('형식이 맞지 않아요'); render(); } break; }
  }
});
window.addEventListener('scroll', ()=>{ const i=document.querySelector('.readbar>i'); if(!i) return; const h=document.documentElement; const max=h.scrollHeight-h.clientHeight; i.style.width=(max>0? Math.min(100, Math.round(h.scrollTop/max*100)):100)+'%'; }, {passive:true});
document.addEventListener('input', e=>{ if(!e.target) return; if(e.target.id==='lsearch'){ ui.lq=e.target.value; filterLessons(); return; } if(e.target.id==='labIn') ui.lab.prompt=e.target.value; else if(/^dict-/.test(e.target.id)){ const m=e.target.id.match(/^dict-(.+)-(\d+)$/); if(m) ui.dictTyped[m[1]+':'+m[2]]=e.target.value; } });
function speak(txt, slow){ if(!('speechSynthesis' in window)){ toast('이 브라우저는 소리를 지원하지 않아요'); return; } const t=APP.tts||{}; const lang=t.lang||'en-US'; const u=new SpeechSynthesisUtterance(txt); u.lang=lang; const base=t.rate||0.9; u.rate=slow? Math.max(0.5, base*0.7) : base; const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(lang.slice(0,2).toLowerCase())); if(vs.length){ u.voice=vs.find(v=>v.lang.replace('_','-')===lang)||vs[0]; } else if(!speak.warned){ speak.warned=true; toast('영어 음성이 없는 기기예요. Edge·Chrome이나 휴대폰에서 열면 들려요'); } speechSynthesis.cancel(); speechSynthesis.speak(u); }
function normEn(s){ return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/\bgonna\b/g,'going to').replace(/\bwanna\b/g,'want to').replace(/\bgotta\b/g,'got to').replace(/\bkinda\b/g,'kind of').replace(/'/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; }
function sim(a,b){ a=normEn(a); b=normEn(b); const d=lev(a,b); const L=Math.max(a.length,b.length)||1; return Math.max(0,Math.round((1-d/L)*100)); }
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){} }
document.addEventListener('keydown', e=>{ if(!S) return; if(e.key==='Enter'&&S.answered){ e.preventDefault(); S.i++; S.answered=false; renderSession(); } else if(/^[1-4]$/.test(e.key)&&!S.answered){ const b=document.querySelector(`[data-ropt="${+e.key-1}"]`); if(b) b.click(); } });

loadLocal(); applySkin(); render(); Sync.init(); AI.init();
