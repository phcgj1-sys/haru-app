  if (!parts.length) return '';
  var dn = appDone(slug);
  return '<div class="links">' + parts.map(function (id) { return '<a href="../' + slug + '/index.html#lesson=' + id + '"' + (dn[id] ? ' class="ok"' : '') + '>' + (dn[id] ? '✓ ' : '') + '수업 ' + esc(id.replace(/^l0?/, '')) + (dn[id] ? ' 마침' : ' 열기') + '</a>'; }).join('') + '</div>';
}

function renderPlan(slug, openN) {
  var info = appInfo(slug);
  if (!info) { location.hash = ''; return; }
  root.innerHTML = seg() + '<p class="muted">계획을 불러오는 중이에요…</p>';
  loadPlan(slug, function (P) {
    if (!P) { root.innerHTML = seg() + '<div class="box"><b>계획을 불러오지 못했어요.</b><p class="small muted">인터넷 연결을 확인하고 다시 열어 주세요.</p><p><a href="#">← 계획 목록</a></p></div>'; return; }
    store._last = slug; save();
    document.title = P.title + ' 20시간 계획 · 하루 학습';
    var st = store[slug] || (store[slug] = { done: {} });
    var done = st.done || (st.done = {});
    var n = Object.keys(done).length;
    var firstOpen = openN || 0;
    if (!firstOpen) { for (var k = 1; k <= 10; k++) if (!done[k]) { firstOpen = k; break; } }
    var h = '<a class="back" href="#" data-tolist="1">‹ 계획 목록</a>';
    h += '<div style="display:flex;gap:12px;align-items:center;margin:4px 0 10px">' + icon(info) + '<div><h1 style="font-size:21px">' + esc(P.title) + '</h1><div class="small muted">20시간 핵심 계획 · 2시간 × 10세션</div></div></div>';
    h += '<div class="stat"><div><b>' + n + '/10</b><span>마친 세션</span></div><div><b>' + (n * 2) + '시간</b><span>공부한 시간</span></div><div><b>' + P.core.length + '개</b><span>핵심 개념</span></div></div>';
    h += '<div class="box"><b>20시간 뒤 할 수 있는 것</b><p>' + esc(P.outcome) + '</p><p class="small muted">' + esc(P.why) + '</p>';
    h += '<p class="row" style="margin-top:12px">' + (n < 10 ? '<a class="btn" href="#app=' + slug + '&s=' + nextSession(slug) + '">세션 ' + nextSession(slug) + ' 시작하기</a>' : '') + '<a class="btn ghost" href="../' + slug + '/index.html">앱 열기 (모든 수업)</a></p></div>';
    h += '<details class="box"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center"><b>핵심 20% 개념 ' + P.core.length + '개</b></summary><ol class="core">';
    P.core.forEach(function (c) { h += '<li><b>' + esc(c[0]) + '</b><div>' + esc(c[1]) + '</div>' + lessonLinks(slug, c[2]) + '</li>'; });
    h += '</ol><div class="skip"><b>이번 20시간에서 미루는 것</b> · ' + fmtIds(slug, esc(P.skip)) + '</div></details>';
    h += '<h2 class="grp" style="margin-top:20px">세션 10개</h2>';
    P.sessions.forEach(function (s) {
      var isDone = !!done[s.n];
      h += '<details class="ses' + (isDone ? ' done' : '') + '" id="s' + s.n + '"' + (s.n === firstOpen ? ' open' : '') + '><summary><span class="num">' + (isDone ? '✓' : s.n) + '</span><span style="flex:1;min-width:0"><div class="sum-t">세션 ' + s.n + '. ' + esc(s.title) + '</div><div class="sum-s">' + (isDone ? esc(done[s.n]) + ' 마침' : (function () { var c = 0; for (var bi = 0; bi < s.blocks.length; bi++) if ((st.blk || {})[s.n + ':' + bi]) c++; return c ? '블록 ' + c + '/' + s.blocks.length + ' 마침 · 이어서 하기' : '2시간 · 마지막 15분 복습'; })()) + '</div></span></summary><div class="ses-body">';
      h += '<div class="goal">' + fmtIds(slug, esc(s.goal)) + '</div>';
      h += '<div class="tags">' + s.core.map(function (ci) { return '<span>' + esc((P.core[ci] || [''])[0]) + '</span>'; }).join('') + '</div>';
      h += '<table class="blocks"><tbody>';
      s.blocks.forEach(function (b, bi) {
        var rv = bi === s.blocks.length - 1;
        var bk = (st.blk || {})[s.n + ':' + bi];
        h += '<tr' + (rv ? ' class="rv"' : '') + (bk ? ' data-ok="1"' : '') + ' data-b="' + bi + '"><td class="tm">' + esc(b[0]) + '</td><td>' + fmtIds(slug, esc(b[1])) + lessonLinks(slug, b[2]) + '</td><td class="ck"><button type="button" class="bk" data-blk="' + s.n + ':' + bi + '" aria-pressed="' + (!!bk) + '" aria-label="' + esc(b[0]) + ' 블록 ' + (bk ? '마침 지우기' : '마침') + '">' + (bk ? '✓' : '') + '</button></td></tr>';
      });
      h += '</tbody></table>';
      h += '<div class="h3">이 세션의 실습</div><div class="practice">' + fmtIds(slug, esc(s.practice)) + '</div>';
      h += '<div class="review"><div class="h3">마지막 15분 복습</div><ul>' + s.review.steps.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      s.review.q.forEach(function (q, qi) { h += '<details><summary>' + (qi + 1) + '. ' + esc(q[0]) + '</summary><p>' + fmtIds(slug, esc(q[1])) + '</p></details>'; });
      h += '</div>';
      h += '<div class="row"><button class="btn ghost" type="button" data-timer="' + s.n + '">2시간 타이머 시작</button><span class="timer" id="tm' + s.n + '" aria-live="polite"></span></div><div class="now" id="now' + s.n + '" hidden></div>';
      h += '<div class="row"><button class="btn" type="button" data-done="' + s.n + '">' + (isDone ? '마침 표시 지우기' : '세션 ' + s.n + ' 마침') + '</button></div>';
      h += '</div></details>';
    });
    if (n === 10) h += '<div class="box"><b>20시간 계획을 다 마쳤어요.</b><p class="small muted">이제 \'앱별 학습\'에서 계획에 없던 수업을 이어 보거나, 복습 질문만 다시 훑어보세요.</p></div>';
    h += '<p class="foot">수업 링크는 그 앱의 수업을 바로 열어요. 진도는 이 기기에만 저장돼요.</p>';
    root.innerHTML = h;
    if (!openN && st.timer && !done[st.timer.n]) openN = st.timer.n;
    if (openN) { var el = document.getElementById('s' + openN); if (el) { el.open = true; el.scrollIntoView(); } } else window.scrollTo(0, 0);
    resumeTimer(P);
    root.onclick = function (ev) {
      var t = ev.target.closest('button');
      if (!t) return;
      if (t.dataset.blk) {
        st.blk = st.blk || {}; var key = t.dataset.blk, sn0 = +key.split(':')[0], bi0 = +key.split(':')[1], ses = P.sessions[sn0 - 1];
        if (st.blk[key]) delete st.blk[key]; else { var r = String(ses.blocks[bi0][0]).split(/[–-]/); st.blk[key] = { d: todayStr(), m: Math.max(0, toMin(r[1]) - toMin(r[0])) }; }
        var all = true; for (var q = 0; q < ses.blocks.length; q++) if (!st.blk[sn0 + ':' + q]) all = false;
        if (all && !done[sn0]) { done[sn0] = todayStr(); if (st.timer && st.timer.n === sn0) delete st.timer; }
        save(); renderPlan(slug, all ? Math.min(sn0 + 1, 10) : sn0); return;
      }
      if (t.dataset.done) {
        var sn = +t.dataset.done;
        if (done[sn]) delete done[sn];
        else { var d = new Date(); done[sn] = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
        if (st.timer && st.timer.n === sn) delete st.timer;
        save();
        stopTimer();
        renderPlan(slug, done[sn] ? Math.min(sn + 1, 10) : sn);
      } else if (t.dataset.timer) {
        startTimer(P, +t.dataset.timer, t);
      }
    };
  });
}

function resumeTimer(P) {
  var st = store[P.slug]; if (!st || !st.timer) return;
  var t = st.timer, el = Date.now() - t.start;
  if (!(el >= 0 && el < 7200000) || (st.done && st.done[t.n])) { delete st.timer; save(); return; }
  var btn = document.querySelector('[data-timer="' + t.n + '"]'); if (btn) startTimer(P, t.n, btn, t.start);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function toMin(x) { var m = /(\d):(\d\d)/.exec(x); return m ? (+m[1]) * 60 + (+m[2]) : 0; }
function startTimer(P, sn, btn, startAt) {
  var s = P.sessions[sn - 1];
  var st = store[P.slug] || (store[P.slug] = { done: {} });
  if (!startAt && timerId && btn.dataset.running === '1') { stopTimer(); delete st.timer; save(); btn.dataset.running = ''; btn.textContent = '2시간 타이머 시작'; document.getElementById('tm' + sn).textContent = ''; document.getElementById('now' + sn).hidden = true; return; }
  stopTimer();
  Array.prototype.forEach.call(document.querySelectorAll('[data-timer]'), function (o) { if (o !== btn) { o.dataset.running = ''; o.textContent = '2시간 타이머 시작'; var on = +o.dataset.timer; var a = document.getElementById('tm' + on), b2 = document.getElementById('now' + on); if (a) a.textContent = ''; if (b2) b2.hidden = true; var rows = document.querySelectorAll('#s' + on + ' tr[data-b]'); for (var z = 0; z < rows.length; z++) rows[z].style.outline = ''; } });
  var start = startAt || Date.now();
  if (!startAt) { st.timer = { n: sn, start: start }; save(); }
  btn.dataset.running = '1'; btn.textContent = '타이머 멈추기';
  var tm = document.getElementById('tm' + sn), now = document.getElementById('now' + sn);
  function tick() {
    var el = Math.floor((Date.now() - start) / 1000), mins = el / 60;
    var left = Math.max(0, 7200 - el);
    tm.textContent = '남은 시간 ' + Math.floor(left / 3600) + ':' + ('0' + Math.floor(left % 3600 / 60)).slice(-2) + ':' + ('0' + left % 60).slice(-2);
    var cur = -1;
    s.blocks.forEach(function (b, bi) { var r = b[0].split(/[–-]/); if (mins >= toMin(r[0]) && mins < toMin(r[1])) cur = bi; });
    var rows = document.querySelectorAll('#s' + sn + ' tr[data-b]');
    for (var i = 0; i < rows.length; i++) rows[i].style.outline = (i === cur ? '2px solid var(--fg)' : '');
    if (cur >= 0) { now.hidden = false; now.textContent = '지금: ' + s.blocks[cur][1]; }
    if (left === 0) { stopTimer(); if (st.timer && st.timer.n === sn) { delete st.timer; save(); } now.hidden = false; now.textContent = '2시간이 끝났어요. 복습을 마쳤다면 \'세션 ' + sn + ' 마침\'을 눌러요.'; btn.textContent = '2시간 타이머 시작'; btn.dataset.running = ''; }
  }
  tick();
  timerId = setInterval(tick, 1000);
}

function route() {
  stopTimer();
  cameFromList = (lastHash === '' || lastHash === '#') && /^#app=/.test(location.hash); lastHash = location.hash;
  var m = /^#app=([a-z0-9]+)(?:&s=(\d+))?$/.exec(location.hash);
  if (m) renderPlan(m[1], m[2] ? +m[2] : 0); else renderList();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', function (e) { var a = e.target.closest('a[data-tolist]'); if (a && cameFromList) { e.preventDefault(); history.back(); } });
route();
if ('serviceWorker' in navigator && location.protocol !== 'file:') { navigator.serviceWorker.register('../sw.js').catch(function () {}); }
</script>
</body>
</html>
