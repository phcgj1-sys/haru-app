name: pc-check

on:
  push:
    paths:
      - 'pc-check/**'
      - '.github/workflows/pc-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-check
    steps:
      - uses: actions/checkout@v4

      - name: 단위·시나리오 테스트 (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Run-Tests.ps1

      - name: 단위·시나리오 테스트 (PowerShell 7)
        if: success() || failure()
        shell: pwsh
        run: ./tests/Run-Tests.ps1

      - name: PSScriptAnalyzer (오류 + 5.1 호환성)
        if: success() || failure()
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $settings = @{
            Rules = @{
              PSUseCompatibleSyntax   = @{ Enable = $true; TargetVersions = @('5.1', '7.0') }
              PSUseCompatibleCmdlets  = @{ Compatibility = @('desktop-5.1.14393.206-windows') }
            }
          }
          $all = Invoke-ScriptAnalyzer -Path ./PCCheck.ps1 -Settings $settings
          $all += Invoke-ScriptAnalyzer -Path ./PCCheck.ps1 -Severity Error
          $all | Sort-Object Line -Unique | Format-Table Severity, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 220 | Write-Host
          $bad = @($all | Where-Object { $_.Severity -eq 'Error' -or $_.RuleName -like 'PSUseCompatible*' })
          if ($bad.Count) { throw "분석 오류 $($bad.Count) 건" }

      - name: 실제 PC 검사 실행 (5.1, 무인 모드)
        if: success() || failure()
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'report'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $r = ./PCCheck.ps1 -Mode Silent -Days 30 -OutDir $out | Select-Object -Last 1
          Write-Host "소요 시간: $([int]$sw.Elapsed.TotalSeconds)초"
          if (-not (Test-Path $r.Html)) { throw 'HTML 보고서 없음' }
          $j = Get-Content -Raw -Encoding UTF8 $r.Json | ConvertFrom-Json
          Write-Host "수집 실패 항목: $(@($j.Errors).Count)"
          $j.Errors | Format-Table | Out-String | Write-Host
          Write-Host "GPU: $(@($j.Gpus).Count) · 디스크: $(@($j.Disks).Count) · RAM: $(@($j.Dimms).Count) · 종료기록: $(@($j.Shutdowns).Count)"
          if (-not $j.System.OS) { throw '시스템 정보 수집 실패' }
          if (@($j.Errors).Count -gt 0) { throw '수집 단계 오류 발생' }
          ./PCCheck.ps1 -Mode Silent -FromJson $r.Json -OutDir (Join-Path $env:RUNNER_TEMP 'rerender') -NoOpen

      - name: 실제 PC 검사 실행 (PowerShell 7)
        if: success() || failure()
        shell: pwsh
        run: |
          $r = ./PCCheck.ps1 -Mode Silent -Days 7 -OutDir (Join-Path $env:RUNNER_TEMP 'report7') | Select-Object -Last 1
          $j = Get-Content -Raw $r.Json | ConvertFrom-Json
          if (@($j.Errors).Count -gt 0) { $j.Errors | Format-Table | Out-String | Write-Host; throw '수집 단계 오류 발생' }

      - name: 화면(GUI) 생성 검사
        if: success() || failure()
        shell: powershell
        run: powershell -NoProfile -STA -File ./PCCheck.ps1 -Mode Gui -GuiSmokeTest

      - name: 외부 도구 다운로드·무결성 검사
        if: success() || failure()
        shell: powershell
        run: |
          . ./PCCheck.ps1 -LoadOnly
          $script:WorkDir = Join-Path $env:RUNNER_TEMP 'tools'
          $p = Install-MemtestVulkan; Write-Host "memtest_vulkan: $p"
          try { $b = Install-BlueScreenView; Write-Host "BlueScreenView: $b" }
          catch { Write-Host "::warning::BlueScreenView 다운로드 실패: $($_.Exception.Message)" }

      - name: 배포 패키지 만들기
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PCCheck'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item ./PCCheck.ps1, ./*.bat, ./README.md, ./THIRD-PARTY.md -Destination $pkg
          Compress-Archive -Path "$pkg/*" -DestinationPath (Join-Path $env:RUNNER_TEMP 'PCCheck.zip') -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PCCheck
          path: |
            ${{ runner.temp }}/PCCheck.zip
            ${{ runner.temp }}/report/*.html
