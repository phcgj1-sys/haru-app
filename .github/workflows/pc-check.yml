name: pc-check

on:
  push:
    paths:
      - 'pc-check/**'
      - '.github/workflows/pc-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Inline scripts stay ASCII-only: the runner writes them without a BOM and
# Windows PowerShell 5.1 would misread Korean text. Korean lives in the .ps1 files.
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: pc-check
    steps:
      - uses: actions/checkout@v4

      - name: Unit and scenario tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Run-Tests.ps1

      - name: Unit and scenario tests (PowerShell 7)
        if: success() || failure()
        shell: pwsh
        run: ./tests/Run-Tests.ps1

      - name: PSScriptAnalyzer (errors + 5.1 compatibility)
        if: success() || failure()
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $settings = @{ Rules = @{
              PSUseCompatibleSyntax  = @{ Enable = $true; TargetVersions = @('5.1', '7.0') }
              PSUseCompatibleCmdlets = @{ Compatibility = @('desktop-5.1.14393.206-windows') } } }
          $all = @(Invoke-ScriptAnalyzer -Path ./PCCheck.ps1 -Settings $settings) + @(Invoke-ScriptAnalyzer -Path ./PCCheck.ps1 -Severity Error)
          $bad = @($all | Where-Object { $_.Severity -eq 'Error' -or $_.RuleName -like 'PSUseCompatible*' })
          $bad | Format-Table Severity, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 220 | Write-Host
          if ($bad.Count) { throw "analyzer findings: $($bad.Count)" }

      - name: Real scan on this machine (Windows PowerShell 5.1)
        if: success() || failure()
        shell: powershell
        run: ./tests/CI-Run.ps1

      - name: Real scan on this machine (PowerShell 7)
        if: success() || failure()
        shell: pwsh
        run: ./tests/CI-Run.ps1

      - name: GUI construction
        if: success() || failure()
        shell: powershell
        run: |
          $env:PCCHECK_SHOT = Join-Path $env:RUNNER_TEMP 'gui.png'
          powershell -NoProfile -STA -File ./PCCheck.ps1 -Mode Gui -GuiSmokeTest



      - name: External tool download and integrity
        if: success() || failure()
        shell: powershell
        run: ./tests/CI-Run.ps1 -ToolCheck

      - name: Build EXE
        timeout-minutes: 6
        shell: powershell
        run: ./build/Build-Exe.ps1 -OutDir "$env:RUNNER_TEMP\PCCheck"

      - name: Package ZIP
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PCCheck'
          Copy-Item ./PCCheck.ps1, ./*.bat, ./README.md, ./THIRD-PARTY.md -Destination $pkg
          Compress-Archive -Path "$pkg/*" -DestinationPath (Join-Path $env:RUNNER_TEMP 'PCCheck.zip') -Force
          Get-ChildItem $pkg | Format-Table Name, Length | Out-String | Write-Host

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: PCCheck
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/PCCheck.zip
            ${{ runner.temp }}/report-*/*.html
            ${{ runner.temp }}/gui.png

